name: Build plot-search model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "HF model"
        default: "intfloat/multilingual-e5-small"
      stem:
        description: "file stem"
        default: "e5_small"
      tag:
        description: "release tag"
        default: "model-e5-small-v1"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu && pip install "transformers>=4.44,<4.50" onnx onnxruntime tokenizers numpy sentencepiece
      - run: python tools/export_e5.py out "${{ inputs.model }}" "${{ inputs.stem }}" && cd out && sha256sum ${{ inputs.stem }}_int8.onnx > ${{ inputs.stem }}_int8.onnx.sha256 && sha256sum tokenizer.json > tokenizer.json.sha256 && ls -la
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ${{ inputs.tag }} >/dev/null 2>&1 || gh release create ${{ inputs.tag }} --title "Plot-search model (${{ inputs.model }})" \
            --notes "${{ inputs.model }} (MIT) — https://huggingface.co/${{ inputs.model }}. ONNX, dynamic int8, for MangaFlow plot search and recommendations." --latest=false
          gh release upload ${{ inputs.tag }} out/${{ inputs.stem }}_int8.onnx out/${{ inputs.stem }}_int8.onnx.sha256 out/tokenizer.json out/tokenizer.json.sha256 --clobber
