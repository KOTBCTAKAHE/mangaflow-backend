name: Live sources check

on:
  workflow_dispatch:
  push:
    branches: [live-check]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx
      - run: python tools/fetch_pages.py
        timeout-minutes: 15
      - uses: actions/upload-artifact@v4
        with:
          name: pages
          path: pages
          retention-days: 1
