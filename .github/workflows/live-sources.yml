name: Live sources check

on:
  workflow_dispatch:
  push:
    branches: [live-check]

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install httpx numpy scipy pillow
      - run: python tools/ranobe_probe.py
        timeout-minutes: 5
