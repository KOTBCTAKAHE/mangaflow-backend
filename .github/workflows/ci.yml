name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mangaflow
          POSTGRES_PASSWORD: mangaflow
          POSTGRES_DB: mangaflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mangaflow" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mangaflow:mangaflow@localhost:5432/mangaflow_test
      DATABASE_URL: postgresql+asyncpg://mangaflow:mangaflow@localhost:5432/mangaflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          pip install -e "source_adapters[test]"
          pip install -e "backend[test]"
          pip install ruff
      - name: Lint
        run: ruff check --select E,F,W,B --ignore E501,B008 source_adapters backend/app
      - name: Source adapter tests
        run: pytest -q source_adapters/tests
      - name: Migrations (upgrade → downgrade → upgrade)
        working-directory: backend
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build & smoke-test the compose stack
        working-directory: infrastructure
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=.*/SECRET_KEY=ci-secret-ci-secret-ci-secret-ci-secret/' .env
          docker compose up -d --build --wait api postgres redis nginx
          for i in $(seq 1 30); do curl -fsS http://localhost:8080/health/ready && break; sleep 2; done
          curl -fsS http://localhost:8080/api/v1/sources | head -c 300
          curl -fsS -X POST http://localhost:8080/api/v1/auth/register -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","username":"ci_user","password":"ci-pass-123"}' | head -c 200
      - name: Logs on failure
        if: failure()
        working-directory: infrastructure
        run: docker compose logs --tail 200

  # Publishes ghcr.io/kotbctakahe/mangaflow-backend (:latest and :sha-xxxxxxx) after
  # tests pass on main, so servers update with `docker compose pull && docker compose up -d`.
  publish:
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kotbctakahe/mangaflow-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=mangaflow-backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/backend.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the image is public (anonymous pull, as on a server)
        run: |
          docker logout ghcr.io
          docker manifest inspect ghcr.io/kotbctakahe/mangaflow-backend:latest | grep -E '"architecture"' | sort -u
