worker_processes auto;
events { worker_connections 2048; }

http {
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  client_max_body_size 32m;
  gzip on;
  gzip_types application/json text/plain;

  # Edge cache for the signed image proxy (CDN-compatible: same headers a CDN would honour).
  proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:50m max_size=5g inactive=14d use_temp_path=off;

  upstream api { server api:8000; keepalive 32; }

  server {
    listen 80;

    location /api/v1/images/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_cache images;
      proxy_cache_key $uri$is_args$args;
      proxy_cache_valid 200 14d;
      proxy_cache_valid 404 10m;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 60s;
    }
  }
}
