[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaflow-sources"
version = "0.1.0"
description = "Source Adapter Layer for MangaFlow: Russian manga catalogs ported from redcatpet/mangayomi-ru-sources"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "httpx>=0.27",
    "selectolax>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["mangaflow_sources*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
