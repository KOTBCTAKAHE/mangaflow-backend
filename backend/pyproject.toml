[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mangaflow-backend"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "mangaflow-sources",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "httpx[socks]>=0.27",
    "redis>=5.0",
    "celery[redis]>=5.4",
    "packaging>=23",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "structlog>=24.1",
    "rapidfuzz>=3.9",
    "pillow>=10.3",
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "usearch>=2.12",
    "tokenizers>=0.15",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
